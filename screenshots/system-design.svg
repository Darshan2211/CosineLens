<text x="122" y="361" font-size="9" fill="#63666F" text-anchor="middle">gemini-embedding-2</text>

<line x1="186" y1="349" x2="206" y2="349" stroke="#9A9CA5" stroke-width="1" marker-end="url(#gray-arr)"/>

<rect x="206" y="326" width="130" height="46" rx="8" fill="#EEF2FF" stroke="#AFC1F5" stroke-width="0.8"/>
