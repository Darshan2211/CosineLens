<line x1="485" y1="241" x2="485" y2="388" stroke="#0A7A52" stroke-width="0.8" marker-end="url(#green-arr)" stroke-dasharray="4 3"/>

<!-- ═══ CACHE LAYER ═══ -->
<rect x="40" y="420" width="720" height="56" rx="10" fill="#ECFDF5" stroke="#A3DFC9" stroke-width="0.8"/>

<rect x="58" y="432" width="196" height="32" rx="6" fill="white" stroke="#A3DFC9" stroke-width="0.7"/>
