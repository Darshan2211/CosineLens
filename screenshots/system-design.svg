<text x="421" y="361" font-size="9" fill="#63666F" text-anchor="middle">keyword · fuzzy · Atlas</text>

<line x1="486" y1="349" x2="506" y2="349" stroke="#9A9CA5" stroke-width="1" marker-end="url(#gray-arr)"/>

<rect x="506" y="326" width="130" height="46" rx="8" fill="#ECFDF5" stroke="#A3DFC9" stroke-width="0.8"/>
<text x="571" y="345" font-size="11" fill="#0A7A52" text-anchor="middle" font-weight="600" font-family="'Inter',sans-serif">RRF Merge</text>
<text x="571" y="361" font-size="9" fill="#0A7A52" text-anchor="middle">K=60 · rank fusion</text>

<line x1="636" y1="349" x2="656" y2="349" stroke="#9A9CA5" stroke-width="1" marker-end="url(#gray-arr)"/>

<rect x="656" y="326" width="88" height="46" rx="8" fill="white" stroke="#E7E8EC" stroke-width="0.7"/>
