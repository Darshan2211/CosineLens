<rect x="406" y="218" width="158" height="46" rx="8" fill="white" stroke="#E7E8EC" stroke-width="0.7"/>
<text x="485" y="237" font-size="11" fill="#0A0A0C" text-anchor="middle" font-weight="600" font-family="'Inter',sans-serif">embedding.service</text>
