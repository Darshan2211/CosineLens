<text x="700" y="361" font-size="9" fill="#63666F" text-anchor="middle">ranked · cached</text>

<!-- pipeline → cache -->
<line x1="200" y1="388" x2="200" y2="418" stroke="#0A7A52" stroke-width="1" marker-end="url(#green-arr)" stroke-dasharray="4 3"/>
