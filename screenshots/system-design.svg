<text x="156" y="457" font-size="9" fill="#9A9CA5" text-anchor="middle">query embedding · TTL 24hr</text>

<rect x="270" y="432" width="220" height="32" rx="6" fill="white" stroke="#A3DFC9" stroke-width="0.7"/>
<text x="380" y="445" font-size="9" fill="#0A7A52" text-anchor="middle">search:{q}:{filters}:{page}</text>
<text x="380" y="457" font-size="9" fill="#9A9CA5" text-anchor="middle">full result · TTL 5min</text>

<rect x="506" y="432" width="238" height="32" rx="6" fill="white" stroke="#A3DFC9" stroke-width="0.7"/>
<text x="625" y="445" font-size="9" fill="#0A7A52" text-anchor="middle">auto:{prefix}</text>
<text x="625" y="457" font-size="9" fill="#9A9CA5" text-anchor="middle">autocomplete · TTL 1hr</text>

