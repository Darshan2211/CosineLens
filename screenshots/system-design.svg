<text x="137" y="253" font-size="9" fill="#63666F" text-anchor="middle">validate · rate limit · filters</text>

<rect x="232" y="218" width="158" height="46" rx="8" fill="white" stroke="#E7E8EC" stroke-width="0.7"/>
<text x="311" y="237" font-size="11" fill="#0A0A0C" text-anchor="middle" font-weight="600" font-family="'Inter',sans-serif">search.service</text>
