<text x="662" y="253" font-size="9" fill="#63666F" text-anchor="middle">Redis get · set · invalidate</text>

<!-- api → pipeline -->
<line x1="400" y1="280" x2="400" y2="310" stroke="#9A9CA5" stroke-width="1" marker-end="url(#gray-arr)"/>

<!-- ═══ SEARCH PIPELINE ═══ -->
<rect x="40" y="312" width="720" height="76" rx="10" fill="#F6F6F9" stroke="#E7E8EC" stroke-width="0.8"/>

<rect x="58" y="326" width="128" height="46" rx="8" fill="white" stroke="#E7E8EC" stroke-width="0.7"/>
