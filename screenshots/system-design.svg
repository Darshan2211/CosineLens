<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="'IBM Plex Mono', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

<!-- Background -->
<rect width="800" height="620" fill="#FAFAFA" rx="16"/>

<!-- Title -->
<text x="40" y="38" font-family="'Inter',sans-serif" font-size="16" font-weight="700" fill="#0A0A0C" letter-spacing="-0.4">CosineLens — System Design</text>
<text x="40" y="56" font-size="10" fill="#9A9CA5" letter-spacing=".04em">Hybrid Semantic Search Engine · Production Architecture</text>

<!-- ═══ LAYER LABELS ═══ -->
<text x="40" y="88" font-size="9" fill="#9A9CA5" letter-spacing=".08em">CLIENT LAYER</text>
<text x="40" y="196" font-size="9" fill="#9A9CA5" letter-spacing=".08em">API LAYER — Node.js · Express (Render)</text>
<text x="40" y="304" font-size="9" fill="#9A9CA5" letter-spacing=".08em">SEARCH PIPELINE</text>
<text x="40" y="412" font-size="9" fill="#9A9CA5" letter-spacing=".08em">CACHE LAYER — Upstash Redis (Serverless)</text>
<text x="40" y="506" font-size="9" fill="#9A9CA5" letter-spacing=".08em">DATABASE — MongoDB Atlas</text>

