<text x="296" y="145" font-size="9" fill="#63666F" text-anchor="middle">useSearchFilters</text>

<rect x="386" y="110" width="148" height="46" rx="8" fill="white" stroke="#E7E8EC" stroke-width="0.7"/>
<text x="460" y="129" font-size="11" fill="#0A0A0C" text-anchor="middle" font-weight="600" font-family="'Inter',sans-serif">usePipeline</text>
<text x="460" y="145" font-size="9" fill="#63666F" text-anchor="middle">Pipeline animation</text>

<rect x="550" y="110" width="194" height="46" rx="8" fill="white" stroke="#E7E8EC" stroke-width="0.7"/>
